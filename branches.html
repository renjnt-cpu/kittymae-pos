<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Branches — Kittymae POS</title>
<link rel="stylesheet" href="css/styles.css?v=20261007p">
</head>
<body>
<main>
  <div id="br-msg"></div>
  <div id="branches-root"></div>
</main>

<script type="module">
// Branches page = the working desk (Ren's second Branches spec, 2026-10-07): pick the branch, search, pick the dates, pick the module
// (POS Walk In & COD / Layaway / Scrap / Subasta), work. The controls live in one sticky bar (js/opsBar.js); a single compact row
// (js/opsStrip.js) shows how the branch is doing; the analytics -- the Branch Operations Summary, the comparison between branches,
// the full Needs Attention list -- moved to POS -> Branch Dashboard. Each module is still its own self-contained tab module mounted into
// its own root -- this page only owns the branch selection, the sticky bar, the forfeited-layaway warning, the deep links and the
// activity-feed links. Online Orders used to live here too -- moved to its own ERP-only page (Ren, 2026-09-24).
import { initShell, toast, esc } from './js/shell.js?v=20261007p';
import { getBranches, subscribeToChanges, listLayaways, getViewableBranchIds, getRecordBranch } from './js/api.js?v=20261007p';
import { renderPosNav } from './js/posNav.js?v=20261007p';
import { loadOpsConfig } from './js/branchOpsConfig.js?v=20261007p';
import { getInitialRange, loadBranchPref, saveBranchPref } from './js/opsPrefs.js?v=20261007p';
import { initOpsBar } from './js/opsBar.js?v=20261007p';
import { initOpsStrip } from './js/opsStrip.js?v=20261007p';
import { openOpsSettings } from './js/branchOpsSettings.js?v=20261007p';
import { initPosTab } from './js/posTab.js?v=20261007p';
import { initLayawayTab } from './js/layawayTab.js?v=20261007p';
import { initScrapTab } from './js/scrapTab.js?v=20261007p';
import { initSubastaTab } from './js/subastaTab.js?v=20261007p';

const fmtDateTime = (s) => s ? new Date(s).toLocaleString('en-PH', { dateStyle: 'medium', timeStyle: 'short' }) : '—';

const employee = await initShell();
if (employee) {
  renderPosNav(employee, 'branches.html');
  await loadOpsConfig();
  // Every active branch -- branchColor()/branchButtonStyle() index into this full list, so
  // it must stay unfiltered; what this employee may SEE is visibleBranches below.
  const branches = await getBranches();
  let viewable;
  try { viewable = new Set(await getViewableBranchIds()); } catch (err) { viewable = new Set(branches.map((b) => b.id)); }
  const visibleBranches = branches.filter((b) => viewable.has(b.id));
  if (!visibleBranches.length) {
    document.getElementById('branches-root').innerHTML =
      '<div class="empty-state"><div class="empty-state-msg">You are not assigned to a branch yet, so there is nothing to show here. Ask an Admin to assign you a branch.</div></div>';
  } else {
    await mountBranches(visibleBranches, branches);
  }
}

async function mountBranches(visibleBranches, branches) {
  const root = document.getElementById('branches-root');
  const deepLink = new URLSearchParams(window.location.search);
  // Branches are the primary lens here -- always exactly one selected. A link from the Branch Dashboard names the branch; otherwise the one
  // looked at last; otherwise the employee's own branch; company-wide employees (branch_id null) start on the first branch they may see.
  const canSee = (id) => visibleBranches.some((b) => b.id === id);
  const pick = (id) => (id != null && canSee(id) ? id : null);
  let selectedBranch = pick(Number(deepLink.get('branch')) || null) ?? pick(loadBranchPref()) ?? pick(employee.branch_id) ?? visibleBranches[0].id;
  const branchName = (id) => (branches.find((b) => b.id === id) || {}).name || '';

  // The modules, in the order of the bar: POS first (the main day-to-day action), then Layaway, Scrap, Subasta. All four stay mounted so
  // switching never loses a filter or an open drawer; each tab's count follows that module's own filters.
  const TABS = [
    { key: 'pos', label: 'POS Walk In & COD', short: 'POS', dot: '#2e7d32', action: '+ New Sale', newBtn: 'pos-new-btn', search: 'pos-f-search', placeholder: 'Search sale, order, customer, SKU, item, reference, admin…' },
    { key: 'layaway', label: 'Layaway', dot: '#c2185b', action: '+ New Layaway', newBtn: 'lw-new-btn', search: 'lw-f-search', placeholder: 'Search customer, contact, order, SKU, item, payment reference…' },
    { key: 'scrap', label: 'Scrap', dot: '#b06a1f', action: '+ New Scrap', newBtn: 'sc-new-btn', search: 'sc-f-search', placeholder: 'Search customer, metal, purity, reference, recorded by…' },
    { key: 'subasta', label: 'Subasta', dot: '#7c3aa8', action: '+ New Subasta', newBtn: 'sb-new-btn', search: 'sb-f-search', placeholder: 'Search item, SKU, pawner, pawn reference, buyer, reference…' },
  ];
  const SUB_TABS = TABS.map((t) => t.key);
  const counts = { pos: 0, layaway: 0, scrap: 0, subasta: 0 };
  const mods = { pos: null, layaway: null, scrap: null, subasta: null };
  let activeSubTab = SUB_TABS.includes(deepLink.get('tab')) ? deepLink.get('tab') : 'pos';
  // The global date range (set in the bar). Read from the same saved preference the Branch Dashboard uses, so each tab's very first render
  // already uses it.
  let range = getInitialRange();
  // Each tab's own From/To inputs, driven by the global range (declared up here: the bar announces the range as soon as it mounts).
  const RANGE_INPUTS = [['pos-f-from', 'pos-f-to'], ['sc-f-from', 'sc-f-to'], ['sb-f-from', 'sb-f-to'], ['mm-from', 'mm-to'], ['mm-pay-f-from', 'mm-pay-f-to']];
  let bar = null, strip = null;

  root.innerHTML =
    '<div id="ops-bar-root"></div>' +
    '<div id="ops-strip-root"></div>' +
    // Forfeited-layaway warning for the selected branch (Ren, 2026-09-21, section 2) -- parked inside the Global Activity panel's pinned slot
    // once the feed mounts (spec 312/326); hidden until refreshForfeitedNotice() finds something.
    '<div id="pos-forfeited-notice" class="act-pinned-warning" style="display:none;"></div>' +
    // Each tab relocates its own secondary filters (status, metal, sort ...) into #tab-filters-slot; showSubTab() shows the one that matches
    // the active tab. (Search and the date range are the bar's.)
    '<div id="tab-filters-slot" class="branch-filter-slot"></div>' +
    '<div id="tab-panel-pos">' +
      '<h2>POS Walk In &amp; COD <span class="muted" id="pos-branch-label" style="font-weight:normal;"></span></h2>' +
      '<div id="pos-root"></div>' +
    '</div>' +
    '<div id="tab-panel-layaway" style="display:none;">' +
      '<div id="layaway-root"></div>' +
    '</div>' +
    '<div id="tab-panel-scrap" style="display:none;">' +
      '<h2 id="scrap-heading">Scrap <span class="muted" id="scrap-branch-label" style="font-weight:normal;"></span></h2>' +
      '<div id="scrap-root"></div>' +
    '</div>' +
    '<div id="tab-panel-subasta" style="display:none;">' +
      '<h2 id="subasta-heading">Subasta <span class="muted" id="sub-branch-label" style="font-weight:normal;"></span></h2>' +
      '<div id="subasta-root"></div>' +
    '</div>';

  const common = {
    esc, toast, msgId: 'br-msg', getBranchId: () => selectedBranch, employee,
    getRange: () => range, requestRange: (preset) => { if (bar) bar.setPreset(preset); },
  };
  const counted = (key) => (count) => { counts[key] = count; if (bar) { bar.renderTabs(); bar.renderAction(); } };
  mods.pos = await initPosTab({ root: document.getElementById('pos-root'), ...common, branches, onCountUpdate: counted('pos') });
  mods.layaway = await initLayawayTab({ root: document.getElementById('layaway-root'), ...common, branches, onCountUpdate: counted('layaway') });
  mods.scrap = await initScrapTab({ root: document.getElementById('scrap-root'), ...common, branches, onCountUpdate: counted('scrap') });
  mods.subasta = await initSubastaTab({ root: document.getElementById('subasta-root'), ...common, branches, onCountUpdate: counted('subasta') });
  await refreshForfeitedNotice();
  // Someone forfeiting a hold (or Admin reopening one) from the Layaway tab should update the warning without needing a branch switch to refresh it.
  subscribeToChanges('layaway_holds', refreshForfeitedNotice);

  // The bar owns the one set of controls: the modules' own "+ New ..." buttons and Search boxes stay in the page (their code and the
  // empty-state shortcuts still use them) but are not shown -- the bar's Search and action button drive them.
  TABS.forEach((t) => {
    document.getElementById(t.newBtn)?.classList.add('km-proxied');
    document.getElementById(t.search)?.closest('.field')?.classList.add('km-proxied');
  });

  // The compact summary row and the bar are mounted last and wrapped so that, whatever happens inside them, the four working tabs above are
  // already up and untouched.
  try {
    strip = initOpsStrip({
      root: document.getElementById('ops-strip-root'), esc, branches, getBranchId: () => selectedBranch, getRange: () => range, showTab: openTab,
      onData: () => { if (bar) bar.renderTabs(); },
      // Admin only (set_branch_ops_setting() checks it again server-side): deadline rule, reminder schedule, branch visibility.
      onOpenSettings: employee.role === 'Admin'
        ? () => openOpsSettings({ esc, onSaved: async (keys) => {
          // Switching branch visibility changes which branches this very page may show -- start fresh.
          if (keys && keys.includes('branch_view_enforced')) { setTimeout(() => window.location.reload(), 700); return; }
          await Promise.all([mods.layaway?.reload(), mods.scrap?.reload(), mods.subasta?.reload(), strip ? strip.refresh() : null]);
        } })
        : undefined,
    });
  } catch (err) {
    console.error('Branch summary row failed to start', err);
    document.getElementById('ops-strip-root').innerHTML = '';
  }
  bar = initOpsBar({
    root: document.getElementById('ops-bar-root'), esc, branches, visibleBranches, getBranchId: () => selectedBranch, onBranch: selectBranch,
    tabs: TABS, getTab: () => activeSubTab, onTab: showSubTab,
    tabInfo: (key) => ({ count: counts[key], urgent: (strip ? strip.getUrgent(selectedBranch) : {})[key] || null }),
    actionInfo: (key) => { const t = TABS.find((x) => x.key === key); const b = document.getElementById(t.newBtn); return { label: t.action, disabled: !b || b.disabled }; },
    onAction: (key) => { const b = document.getElementById(TABS.find((x) => x.key === key).newBtn); if (b && !b.disabled) b.click(); },
    // The search text goes to the module on show -- its own (hidden) search box does the filtering, exactly as if it had been typed there.
    onSearch: (key, text) => { const el = document.getElementById(TABS.find((x) => x.key === key).search); if (el) { el.value = text; el.dispatchEvent(new Event('input', { bubbles: true })); } },
    onRange: (r) => { range = r; applyRangeToTabs(r); if (strip) strip.refresh(); bar.renderTabs(); },
  });
  showSubTab(activeSubTab);

  function showSubTab(key) {
    if (!SUB_TABS.includes(key)) return;
    activeSubTab = key;
    SUB_TABS.forEach((k) => { document.getElementById('tab-panel-' + k).style.display = activeSubTab === k ? '' : 'none'; });
    document.querySelectorAll('#tab-filters-slot [data-filter-tab]').forEach((el) => {
      el.style.display = el.dataset.filterTab === activeSubTab ? '' : 'none';
    });
    if (bar) { bar.renderTabs(); bar.renderAction(); bar.syncSearch(); }
  }
  // A summary row / Needs Attention chip / Branch Dashboard link: switch to the tab, then let the tab scroll to or filter down to what was
  // clicked (each tab decides what a "view" means; one without applyView just opens).
  function openTab(key, view) {
    // Views about what is still open today (a ₱0 sale, an uncollected COD, a pending pickup, a purchase or sale not fully paid) have to look
    // across all dates, not just the selected range.
    if (['zero', 'cod', 'pickup', 'unpaid', 'balance'].includes(view) && bar && bar.getRange().preset !== 'all') bar.setPreset('all');
    showSubTab(key);
    const mod = mods[key];
    if (view && mod && mod.applyView) mod.applyView(view);
    else document.getElementById('tab-panel-' + key)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // The global date range drives every tab's own From/To (those inputs are hidden -- the range lives in the bar). One 'change' event per pair
  // makes the tab re-render; "All Time" leaves them open-ended.
  function applyRangeToTabs(r) {
    const from = r.preset === 'all' ? '' : r.from;
    const to = r.preset === 'all' ? '' : r.to;
    RANGE_INPUTS.forEach(([f, t]) => {
      const a = document.getElementById(f), b = document.getElementById(t);
      if (!a || !b || (a.value === from && b.value === to)) return;
      a.value = from; b.value = to;
      a.dispatchEvent(new Event('change'));
    });
  }

  async function selectBranch(id) {
    if (id === selectedBranch || !canSee(id)) return;
    selectedBranch = id;
    saveBranchPref(id);
    renderBranchLabels();
    if (bar) { bar.renderBranches(); bar.renderTabs(); }
    if (strip) { strip.render(); strip.refresh(); }
    await Promise.all([mods.pos?.reload(), mods.layaway?.reload(), mods.scrap?.reload(), mods.subasta?.reload(), refreshForfeitedNotice()]);
    if (bar) bar.renderAction();
  }
  function renderBranchLabels() {
    const label = ' — ' + branchName(selectedBranch);
    document.getElementById('pos-branch-label').textContent = label;
    document.getElementById('scrap-branch-label').textContent = label;
    document.getElementById('sub-branch-label').textContent = label;
  }
  renderBranchLabels();

  // ---- Global Activity feed integration (spec 312/321) ----
  // (a) The Forfeited notice moves into the feed panel's pinned slot so there's one
  //     notification box. The feed mounts async from the shell, so handle both orders.
  const adoptForfeitedNotice = () => {
    const feed = window.__kmActivity;
    const notice = document.getElementById('pos-forfeited-notice');
    if (feed && notice && notice.parentElement !== feed.pinnedSlot) { feed.pinnedSlot.appendChild(notice); feed.refreshPanelVisibility(); }
  };
  adoptForfeitedNotice();
  document.addEventListener('km-activity-ready', adoptForfeitedNotice);
  // (b) A clicked notification opens its record right here (no reload) when this page
  //     is already open; from another page it arrives via ?tab=&open= instead. A record
  //     that belongs to another branch switches to that branch first (if this employee may
  //     see it) -- previously it silently did nothing.
  // (POS opens a sale even when it is outside the loaded date range, so it offers openDetailAsync.)
  const openIn = async (mod, id) => (mod.openDetailAsync ? mod.openDetailAsync(id) : mod.openDetail(id));
  async function openRecord(tab, mod, table, id) {
    showSubTab(tab);
    if (mod && (await openIn(mod, id)) !== false) return;
    try {
      const b = await getRecordBranch(table, id);
      if (b != null && b !== selectedBranch && canSee(b)) {
        await selectBranch(b);
        await openIn(mod, id);
      }
    } catch (err) { /* not found / not visible: nothing to open */ }
  }
  const openers = {
    pos_sale: (id) => openRecord('pos', mods.pos, 'pos_sale', id),
    layaway_holds: (id) => openRecord('layaway', mods.layaway, 'layaway_holds', Number(id)),
    scrap_entries: (id) => openRecord('scrap', mods.scrap, 'scrap_entries', Number(id)),
    subasta_items: (id) => openRecord('subasta', mods.subasta, 'subasta_items', Number(id)),
  };
  window.__kmOpenRecord = (table, id) => { if (!openers[table]) return false; openers[table](id); return true; };
  const tabToTable = { pos: 'pos_sale', layaway: 'layaway_holds', scrap: 'scrap_entries', subasta: 'subasta_items' };
  // ?branch=&tab=&view= -- how a Branch Dashboard card opens the exact place (branch + module + view); ?tab=&open= -- an activity notification.
  if (deepLink.get('tab') && SUB_TABS.includes(deepLink.get('tab'))) openTab(deepLink.get('tab'), deepLink.get('view'));
  if (deepLink.get('open') && tabToTable[deepLink.get('tab')]) openers[tabToTable[deepLink.get('tab')]](deepLink.get('open'));

  // Ren, 2026-09-21, section 2: "If a layaway transaction has already been marked as
  // FORFEITED, show a small notification/note inside the POS ... should NOT block
  // normal POS operations." Scoped to the selected branch; a failed lookup is
  // non-critical and just leaves the notice as it was.
  async function refreshForfeitedNotice() {
    const box = document.getElementById('pos-forfeited-notice');
    if (!box) return;
    try {
      const holds = await listLayaways(selectedBranch);
      const forfeited = holds.filter((h) => h.status === 'Forfeited');
      if (!forfeited.length) { box.style.display = 'none'; box.innerHTML = ''; window.__kmActivity?.refreshPanelVisibility(); return; }
      box.style.display = '';
      window.__kmActivity?.refreshPanelVisibility();
      box.innerHTML =
        '<div style="font-weight:bold;color:#a15c00;">⚠ FORFEITED LAYAWAY' + (forfeited.length > 1 ? 'S' : '') + '</div>' +
        '<div class="muted" style="margin:2px 0 6px;">This layaway transaction has already been forfeited -- do not process it as an active layaway.</div>' +
        forfeited.slice(0, 3).map((h) =>
          '<div style="margin-top:4px;padding-top:4px;border-top:1px dashed #e2c88a;">' +
            esc(h.customer_name) + (h.order_id ? ' · Order ' + esc(h.order_id) : '') + '<br>' +
            esc(h.sku) + '<br>' +
            '<span class="muted">Forfeited ' + fmtDateTime(h.forfeited_at) + '</span>' +
          '</div>'
        ).join('') +
        (forfeited.length > 3 ? '<div class="muted" style="margin-top:4px;">+' + (forfeited.length - 3) + ' more at this branch</div>' : '');
    } catch (err) { /* non-critical -- leave the notice as it was rather than block POS */ }
  }
}
</script>
</body>
</html>
