<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Branches — Kittymae POS</title>
<link rel="stylesheet" href="css/styles.css?v=20260925q">
</head>
<body>
<main>
  <div id="br-msg"></div>
  <div id="branches-root"></div>
</main>

<script type="module">
// Branches page: a branch picker plus four per-branch modules (POS, Layaway, Scrap,
// Subasta), each its own self-contained tab module mounted into its own root -- this
// page only owns the branch selection, the tab bar, the forfeited-layaway warning,
// and the activity-feed deep links. Online Orders used to live here too -- moved to
// its own ERP-only page (Ren, 2026-09-24: "remove online order in all branch in the
// POS move online order in the ERP only make it in one module... under sales").
import { initShell, toast, esc } from './js/shell.js?v=20260925q';
import { getBranches, subscribeToChanges, listLayaways } from './js/api.js?v=20260925q';
import { renderPosNav } from './js/posNav.js?v=20260925q';
import { branchButtonStyle } from './js/branchColors.js?v=20260925q';
import { initPosTab } from './js/posTab.js?v=20260925q';
import { initLayawayTab } from './js/layawayTab.js?v=20260925q';
import { initScrapTab } from './js/scrapTab.js?v=20260925q';
import { initSubastaTab } from './js/subastaTab.js?v=20260925q';

const fmtDateTime = (s) => s ? new Date(s).toLocaleString('en-PH', { dateStyle: 'medium', timeStyle: 'short' }) : '—';

const employee = await initShell();
if (employee) {
  renderPosNav(employee, 'branches.html');
  const root = document.getElementById('branches-root');
  const branches = await getBranches();
  // Branches are the primary lens here -- always exactly one selected. Anyone with a
  // fixed branch_id starts on their own branch (Branch Supervisor is also locked
  // there); company-wide employees (branch_id null) start on the first branch.
  let selectedBranch = employee.branch_id ?? branches[0].id;
  const branchName = (id) => (branches.find((b) => b.id === id) || {}).name || '';

  // Each module reports its own filtered count for the tab bar (MASTER UI rule 20).
  let posCount = 0, pos = null;
  let layawayCount = 0, layaway = null;
  let scrapCount = 0, scrap = null;
  let subastaCount = 0, subasta = null;
  let activeSubTab = 'pos';

  root.innerHTML =
    // Forfeited-layaway warning for the selected branch (Ren, 2026-09-21, section 2)
    // -- parked inside the Global Activity panel's pinned slot once the feed mounts
    // (spec 312/326); hidden until refreshForfeitedNotice() finds something.
    '<div id="pos-forfeited-notice" class="act-pinned-warning" style="display:none;"></div>' +
    // Each tab (POS/Layaway/Scrap/Subasta) relocates its own Search/date-range card
    // into #tab-filters-slot (same appendChild-relocation pattern already used for
    // the forfeited notice above, into the Activity feed's pinned slot) -- left of
    // Branch on desktop, below it on mobile (Ren, 2026-09-24). showSubTab() below
    // shows/hides whichever relocated card matches the active tab.
    '<div class="branch-filter-row">' +
      '<div class="card branch-card">' +
        '<h3>Branch</h3>' +
        '<div id="branch-buttons" style="display:flex;gap:8px;flex-wrap:wrap;"></div>' +
      '</div>' +
      '<div id="tab-filters-slot" class="branch-filter-slot"></div>' +
    '</div>' +
    '<div id="scrap-sub-tabs" style="display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 14px;"></div>' +

    '<div id="tab-panel-pos">' +
      '<h2>POS Walk In &amp; COD <span class="muted" id="pos-branch-label" style="font-weight:normal;"></span></h2>' +
      '<div id="pos-root"></div>' +
    '</div>' +
    '<div id="tab-panel-layaway" style="display:none;">' +
      '<h2>Layaway <span class="muted" id="layaway-branch-label" style="font-weight:normal;"></span></h2>' +
      '<div id="layaway-root"></div>' +
    '</div>' +
    '<div id="tab-panel-scrap" style="display:none;">' +
      '<h2 id="scrap-heading">Scrap <span class="muted" id="scrap-branch-label" style="font-weight:normal;"></span></h2>' +
      '<div id="scrap-root"></div>' +
    '</div>' +
    '<div id="tab-panel-subasta" style="display:none;">' +
      '<h2 id="subasta-heading">Subasta <span class="muted" id="sub-branch-label" style="font-weight:normal;"></span></h2>' +
      '<div id="subasta-root"></div>' +
    '</div>';

  renderBranchButtons();
  renderScrapSubTabs();

  const common = { esc, toast, msgId: 'br-msg', getBranchId: () => selectedBranch, employee };
  pos = await initPosTab({ root: document.getElementById('pos-root'), ...common, branches, onCountUpdate: (count) => { posCount = count; renderScrapSubTabs(); } });
  layaway = await initLayawayTab({ root: document.getElementById('layaway-root'), ...common, onCountUpdate: (count) => { layawayCount = count; renderScrapSubTabs(); } });
  scrap = await initScrapTab({ root: document.getElementById('scrap-root'), ...common, onCountUpdate: (count) => { scrapCount = count; renderScrapSubTabs(); } });
  subasta = await initSubastaTab({ root: document.getElementById('subasta-root'), ...common, branches, onCountUpdate: (count) => { subastaCount = count; renderScrapSubTabs(); } });
  await refreshForfeitedNotice();
  // Someone forfeiting a hold (or Admin reopening one) from the Layaway tab should
  // update the warning without needing a branch switch to refresh it.
  subscribeToChanges('layaway_holds', refreshForfeitedNotice);

  // ---- tab bar: POS first (the main day-to-day action), then Layaway, Scrap,
  // Subasta. All four stay mounted so switching never loses a filter or an open
  // drawer; each pill's count follows that module's own active filters. ----
  const SUB_TABS = ['pos', 'layaway', 'scrap', 'subasta'];
  function renderScrapSubTabs() {
    const pill = (key, label, dot, count) => {
      const active = activeSubTab === key;
      return '<button type="button" data-tab="' + key + '" style="cursor:pointer;font:inherit;padding:8px 16px;border-radius:20px;display:inline-flex;align-items:center;gap:7px;' +
        (active ? 'background:var(--rose);border:1px solid var(--rose);color:var(--ink);font-weight:600;' : 'background:#fff;border:1px solid #ddd;color:#555;') + '">' +
        '<span style="width:8px;height:8px;border-radius:50%;background:' + dot + ';display:inline-block;"></span>' + esc(label) +
        '<span style="background:' + (active ? 'rgba(255,255,255,0.65)' : '#f0f0f0') + ';border-radius:10px;padding:1px 7px;font-size:11px;">' + count + '</span>' +
      '</button>';
    };
    const box = document.getElementById('scrap-sub-tabs');
    box.innerHTML = pill('pos', 'POS Walk In & COD', '#2e7d32', posCount) +
      pill('layaway', 'Layaway', '#c2185b', layawayCount) +
      pill('scrap', 'Scrap', '#b06a1f', scrapCount) + pill('subasta', 'Subasta', '#7c3aa8', subastaCount);
    box.querySelectorAll('[data-tab]').forEach((btn) => btn.addEventListener('click', () => showSubTab(btn.dataset.tab)));
  }
  function showSubTab(key) {
    if (!SUB_TABS.includes(key)) return;
    activeSubTab = key;
    SUB_TABS.forEach((k) => { document.getElementById('tab-panel-' + k).style.display = activeSubTab === k ? '' : 'none'; });
    document.querySelectorAll('#tab-filters-slot [data-filter-tab]').forEach((el) => {
      el.style.display = el.dataset.filterTab === activeSubTab ? '' : 'none';
    });
    renderScrapSubTabs();
  }

  // ---- Global Activity feed integration (spec 312/321) ----
  // (a) The Forfeited notice moves into the feed panel's pinned slot so there's one
  //     notification box. The feed mounts async from the shell, so handle both orders.
  const adoptForfeitedNotice = () => {
    const feed = window.__kmActivity;
    const notice = document.getElementById('pos-forfeited-notice');
    if (feed && notice && notice.parentElement !== feed.pinnedSlot) { feed.pinnedSlot.appendChild(notice); feed.refreshPanelVisibility(); }
  };
  adoptForfeitedNotice();
  document.addEventListener('km-activity-ready', adoptForfeitedNotice);
  // (b) A clicked notification opens its record right here (no reload) when this page
  //     is already open; from another page it arrives via ?tab=&open= instead.
  const openers = {
    pos_sale: (id) => { showSubTab('pos'); pos?.openDetail(id); },
    layaway_holds: (id) => { showSubTab('layaway'); layaway?.openDetail(Number(id)); },
    scrap_entries: (id) => { showSubTab('scrap'); scrap?.openDetail(Number(id)); },
    subasta_items: (id) => { showSubTab('subasta'); subasta?.openDetail(Number(id)); },
  };
  window.__kmOpenRecord = (table, id) => { if (!openers[table]) return false; openers[table](id); return true; };
  const deepLink = new URLSearchParams(window.location.search);
  const tabToTable = { pos: 'pos_sale', layaway: 'layaway_holds', scrap: 'scrap_entries', subasta: 'subasta_items' };
  if (deepLink.get('tab')) showSubTab(deepLink.get('tab'));
  if (deepLink.get('open') && tabToTable[deepLink.get('tab')]) openers[tabToTable[deepLink.get('tab')]](deepLink.get('open'));

  function renderBranchButtons() {
    const box = document.getElementById('branch-buttons');
    // Everyone can VIEW every branch here; each module decides on its own whether the
    // signed-in employee may add/edit for the selected branch.
    box.innerHTML = branches.map((b) =>
      '<button type="button" class="btn" style="' + branchButtonStyle(b.id, branches, b.id === selectedBranch) + '" data-id="' + b.id + '">' + esc(b.name) + '</button>'
    ).join('');
    box.querySelectorAll('button').forEach((btn) => btn.addEventListener('click', async () => {
      selectedBranch = Number(btn.dataset.id);
      renderBranchButtons();
      await Promise.all([pos?.reload(), layaway?.reload(), scrap?.reload(), subasta?.reload(), refreshForfeitedNotice()]);
    }));
    const label = ' — ' + branchName(selectedBranch);
    document.getElementById('pos-branch-label').textContent = label;
    document.getElementById('layaway-branch-label').textContent = label;
    document.getElementById('scrap-branch-label').textContent = label;
    document.getElementById('sub-branch-label').textContent = label;
  }

  // Ren, 2026-09-21, section 2: "If a layaway transaction has already been marked as
  // FORFEITED, show a small notification/note inside the POS ... should NOT block
  // normal POS operations." Scoped to the selected branch; a failed lookup is
  // non-critical and just leaves the notice as it was.
  async function refreshForfeitedNotice() {
    const box = document.getElementById('pos-forfeited-notice');
    if (!box) return;
    try {
      const holds = await listLayaways(selectedBranch);
      const forfeited = holds.filter((h) => h.status === 'Forfeited');
      if (!forfeited.length) { box.style.display = 'none'; box.innerHTML = ''; window.__kmActivity?.refreshPanelVisibility(); return; }
      box.style.display = '';
      window.__kmActivity?.refreshPanelVisibility();
      box.innerHTML =
        '<div style="font-weight:bold;color:#a15c00;">⚠ FORFEITED LAYAWAY' + (forfeited.length > 1 ? 'S' : '') + '</div>' +
        '<div class="muted" style="margin:2px 0 6px;">This layaway transaction has already been forfeited -- do not process it as an active layaway.</div>' +
        forfeited.slice(0, 3).map((h) =>
          '<div style="margin-top:4px;padding-top:4px;border-top:1px dashed #e2c88a;">' +
            esc(h.customer_name) + (h.order_id ? ' · Order ' + esc(h.order_id) : '') + '<br>' +
            esc(h.sku) + '<br>' +
            '<span class="muted">Forfeited ' + fmtDateTime(h.forfeited_at) + '</span>' +
          '</div>'
        ).join('') +
        (forfeited.length > 3 ? '<div class="muted" style="margin-top:4px;">+' + (forfeited.length - 3) + ' more at this branch</div>' : '');
    } catch (err) { /* non-critical -- leave the notice as it was rather than block POS */ }
  }
}
</script>
</body>
</html>
