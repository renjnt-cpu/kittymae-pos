<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SKU Catalog — Kittymae POS</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main>
  <div id="prod-msg"></div>
  <div id="products-root"></div>
</main>

<script type="module">
import { initShell, esc } from './js/shell.js';
import { listProducts, getBranches, listAllInventoryQty, subscribeToChanges } from './js/api.js';
import { renderPosNav } from './js/posNav.js';
import { branchColor } from './js/branchColors.js';

// Max rows actually built as <table> DOM rows in one go -- see the comment at its use
// in render() below for why (Ren, 2026-09-17: "lagging" as the catalog grew past 7,400
// SKUs was the table itself, not the fetch).
const CATALOG_RENDER_CAP = 300;

const employee = await initShell();
if (employee) {
  renderPosNav(employee, 'products.html');
  const root = document.getElementById('products-root');
  const branches = await getBranches();

  // View only here for every role -- editing a SKU now happens only in the ERP's own
  // SKU Catalog page, per Ren's request, so this page never renders an Edit/
  // Discontinue/Add control at all. Also deliberately kept to just Product Name/SKU/
  // branch pcs here -- category, price, weight, and every other detail live only in
  // the ERP's fuller catalog view, per Ren's request.
  root.innerHTML =
    '<div class="card">' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;">' +
        '<div class="field" style="min-width:220px;"><label>Search</label><input type="text" id="f-search" placeholder="SKU or product name…"></div>' +
        '<div class="field"><label>Status</label><select id="f-status"><option value="all">All</option><option value="Active" selected>Active</option><option value="Discontinued">Discontinued</option></select></div>' +
        // One Sort control (Ren's 2026-09-21 Filter + Sort spec, section 36) -- generic
        // fields plus this catalog's own "pcs at this branch" sort share one dropdown.
        '<div class="field"><label>Sort By</label><select id="f-sort-branch">' +
          '<option value="sku" selected>SKU</option><option value="item_name">Item Name</option>' +
          '<optgroup label="Pcs at Branch">' + branches.map((b) => '<option value="' + b.id + '">' + esc(b.name) + '</option>').join('') + '</optgroup>' +
        '</select></div>' +
        '<div class="field"><label>Direction</label><select id="f-sort-dir"><option value="asc" selected>Ascending</option><option value="desc">Descending</option></select></div>' +
        '<button type="button" class="btn small secondary" id="f-clear">Clear Filters</button>' +
      '</div>' +
    '</div>' +
    '<div class="tiles" id="prod-tiles"></div>' +
    '<div id="prod-list"><div class="muted">Loading…</div></div>';

  // With 7,392 SKUs, search/status filters query the server directly (listProducts
  // pages through everything that matches instead of stopping at PostgREST's 1000-row
  // per-request cap) rather than fetching everything and filtering client-side.
  let allProducts = [];
  let qtyBySku = {}; // { sku: { branchId: qty_available } }, from listAllInventoryQty()
  let filterBranchId = null; // set by clicking a branch column header -- only SKUs with pcs > 0 there
  let searchTimer = null;
  let realtimeTimer = null;
  await load();
  // Debounced: an edit or the Active/Discontinued toggle firing on one row shouldn't
  // matter much here, but this keeps the same safety pattern as movement.html in
  // case of another bulk import later. Inventory changes (a sale, a stock-in, a
  // transfer) need the same debounce so the per-branch pcs columns stay live too.
  subscribeToChanges(['products', 'inventory'], () => {
    clearTimeout(realtimeTimer);
    realtimeTimer = setTimeout(load, 500);
  });

  document.getElementById('f-search').addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(load, 300);
  });
  document.getElementById('f-status').addEventListener('change', load);
  document.getElementById('f-sort-branch').addEventListener('change', render);
  document.getElementById('f-sort-dir').addEventListener('change', render);
  document.getElementById('f-clear').addEventListener('click', () => {
    document.getElementById('f-search').value = '';
    document.getElementById('f-status').value = 'all';
    document.getElementById('f-sort-branch').value = 'sku';
    document.getElementById('f-sort-dir').value = 'asc';
    filterBranchId = null;
    load();
  });

  async function load() {
    const list = document.getElementById('prod-list');
    list.innerHTML = '<div class="muted">Loading…</div>';
    try {
      const [products, qtyRows] = await Promise.all([
        listProducts({
          search: document.getElementById('f-search').value.trim(),
          status: document.getElementById('f-status').value,
        }),
        listAllInventoryQty(),
      ]);
      allProducts = products;
      qtyBySku = {};
      qtyRows.forEach((r) => {
        (qtyBySku[r.sku] || (qtyBySku[r.sku] = {}))[r.branch_id] = r.qty_available;
      });
      render();
    } catch (err) {
      list.innerHTML = '<div class="msg error">' + esc(err.message || err) + '</div>';
    }
  }

  function render() {
    let rows = allProducts; // already scoped to the current search + status at the query level

    // Click a branch column header to filter down to just the SKUs actually stocked
    // there (pcs > 0) -- click it again to clear. Applied before the tiles below so
    // the subtotal/total reflect whatever's actually showing in the table.
    if (filterBranchId != null) rows = rows.filter((p) => Number((qtyBySku[p.sku] || {})[filterBranchId] || 0) > 0);

    // Subtotal per branch + grand total across all of them -- reflects whatever's
    // currently filtered (search/status/branch), same as the SKU count notice below,
    // and is independent of the sort (sorting only reorders these same rows).
    let grandTotal = 0;
    const branchTiles = branches.map((b) => {
      const total = rows.reduce((s, p) => s + Number((qtyBySku[p.sku] || {})[b.id] || 0), 0);
      grandTotal += total;
      const c = branchColor(b.id, branches);
      return '<div class="tile" style="background:' + c.bg + ';"><div class="num" style="color:' + c.text + ';">' + total.toLocaleString('en-PH') + '</div><div class="lbl" style="color:' + c.text + ';">' + esc(b.name) + '</div></div>';
    });
    document.getElementById('prod-tiles').innerHTML = tile(grandTotal.toLocaleString('en-PH'), 'Total Pcs (All Branches)') + branchTiles.join('');

    // Filtering (search/status/branch-column click) already picked `rows`; sort only
    // reorders them (section 11).
    const sortKey = document.getElementById('f-sort-branch').value;
    const dirMul = document.getElementById('f-sort-dir').value === 'asc' ? 1 : -1;
    const GENERIC_SORT_COMPARATORS = {
      sku: (a, b) => a.sku.localeCompare(b.sku), item_name: (a, b) => a.item_name.localeCompare(b.item_name),
    };
    const genericCmp = GENERIC_SORT_COMPARATORS[sortKey];
    if (genericCmp) {
      rows = rows.slice().sort((a, b) => genericCmp(a, b) * dirMul);
    } else if (sortKey !== 'none') {
      const bId = Number(sortKey);
      rows = rows.slice().sort((a, b) => {
        const qa = Number((qtyBySku[a.sku] || {})[bId] || 0), qb = Number((qtyBySku[b.sku] || {})[bId] || 0);
        return (qa - qb) * dirMul;
      });
    }

    const list = document.getElementById('prod-list');
    if (!rows.length) {
      list.innerHTML = '<p class="muted">No SKUs match this filter.' +
        (filterBranchId != null ? ' <button type="button" class="btn small secondary" id="f-clear-branch">Clear branch filter</button>' : '') + '</p>';
      if (filterBranchId != null) document.getElementById('f-clear-branch').addEventListener('click', () => { filterBranchId = null; render(); });
      return;
    }

    // Rendering every matched row as a real <table> row is what was actually lagging
    // the page (Ren, 2026-09-17) -- with 7,400+ Active SKUs, an unfiltered/unsearched
    // view was building and laying out thousands of DOM rows at once. Tiles/totals
    // above still sum the FULL matched set (`rows`, untouched), only the table body
    // itself is capped -- search, the Status filter, or a branch-column click narrows
    // `rows` below the cap and the whole matched set renders again.
    const matchedCount = rows.length;
    const truncated = matchedCount > CATALOG_RENDER_CAP;
    const renderRows = truncated ? rows.slice(0, CATALOG_RENDER_CAP) : rows;
    const countNotice = '<p class="muted" style="margin:0 0 8px;">' + matchedCount.toLocaleString('en-PH') + ' SKU(s)' +
      (truncated ? ' — showing the first ' + CATALOG_RENDER_CAP + '; search or click a branch column to narrow further' : '') + '</p>';

    function rowHtml(p) {
      const qtyForSku = qtyBySku[p.sku] || {};
      return '<tr data-row-id="' + esc(p.sku) + '">' +
          '<td data-label="SKU"><b>' + esc(p.sku) + '</b></td>' +
          '<td data-label="Product Name">' + esc(p.item_name) + '</td>' +
          branches.map((b) => '<td data-label="' + esc(b.name) + '" style="text-align:center;">' + (qtyForSku[b.id] ?? '—') + '</td>').join('') +
        '</tr>';
    }

    const branchThs = branches.map((b) => {
      const c = branchColor(b.id, branches);
      const active = filterBranchId === b.id;
      return '<th data-branch-filter="' + b.id + '" title="Click to show only SKUs stocked at ' + esc(b.name) + '" style="cursor:pointer;background:' + c.bg + ';color:' + c.text + ';' +
        (active ? 'outline:2px solid ' + c.text + ';outline-offset:-2px;' : '') + '">' + esc(b.name) + (active ? ' ✕' : '') + '</th>';
    }).join('');

    list.innerHTML = (filterBranchId != null ? '<p class="muted" style="margin:0 0 8px;">Showing only SKUs stocked at <b>' + esc((branches.find((b) => b.id === filterBranchId) || {}).name) + '</b> — click the column again to clear.</p>' : '') +
      countNotice + '<div class="table-scroll table-mini"><table><thead><tr style="white-space:nowrap;">' +
      '<th>SKU</th><th>Product Name</th>' + branchThs +
      '</tr></thead><tbody>' + renderRows.map(rowHtml).join('') + '</tbody></table></div>';

    list.querySelectorAll('[data-branch-filter]').forEach((th) => th.addEventListener('click', () => {
      const id = Number(th.dataset.branchFilter);
      filterBranchId = filterBranchId === id ? null : id;
      render();
    }));
  }

  function tile(num, label) { return '<div class="tile"><div class="num">' + num + '</div><div class="lbl">' + esc(label) + '</div></div>'; }
}
</script>
</body>
</html>
