<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kittymae POS</title>
<link rel="stylesheet" href="css/styles.css">
<style>
  .pos-header { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
  .pos-header h1 { margin:0; font-size:20px; }
  .pos-header .who { font-size:13px; color:var(--muted, #666); }
</style>
</head>
<body>
<main>
  <div class="pos-header">
    <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
      <h1>💍 Kittymae POS</h1>
      <a href="products.html" class="btn small secondary">SKU Catalog</a>
      <a href="movement.html" class="btn small secondary">Record Movement</a>
      <a href="layaway.html" class="btn small secondary">Layaway</a>
    </div>
    <div id="pos-who" class="who"></div>
  </div>

  <div class="card">
    <h3>Look Up a SKU</h3>
    <p class="muted" style="margin-top:-4px;">Quick product lookup — SKU, price, weight, status. New SKUs are added in the Google Sheet, not here (see SKU Catalog on the main system for that). To record a movement, use <a href="movement.html">Record Movement</a>.</p>
    <div class="field" style="max-width:380px;"><label>Search</label><input type="text" id="lookup-search" placeholder="SKU or product name…"></div>
    <div id="lookup-results" style="margin-top:10px;"></div>
  </div>
</main>

<script type="module">
import { initShell, esc } from './js/shell.js';
import { signOut } from './js/auth.js';
import { searchProducts } from './js/api.js';

const money = (n) => n === null || n === undefined ? '—' : '₱' + Number(n).toLocaleString('en-PH', { minimumFractionDigits: 2 });
const weight = (n) => n === null || n === undefined ? '—' : Number(n).toLocaleString('en-PH', { minimumFractionDigits: 3 }) + ' g';

// initShell() does the real work (session check, employee lookup, NOT_REGISTERED/
// INACTIVE screens) -- reused as-is rather than re-implementing auth from scratch.
// It builds no header/nav of its own; this page renders its own minimal "Kittymae POS"
// header below, since it's meant to feel like its own focused front door, not another
// ERP nav tab.
const employee = await initShell();
if (employee) {
  document.getElementById('pos-who').innerHTML =
    esc(employee.full_name) + ' · ' + esc(employee.role) +
    (employee.branch_id ? ' · Branch #' + employee.branch_id : ' · All Branches') +
    ' <button class="btn small secondary" id="pos-signout">Sign out</button>';
  document.getElementById('pos-signout').addEventListener('click', signOut);

  // ---- SKU lookup ----
  const lookupInput = document.getElementById('lookup-search');
  const lookupResults = document.getElementById('lookup-results');
  let lookupTimer = null;
  lookupInput.addEventListener('input', () => {
    clearTimeout(lookupTimer);
    const q = lookupInput.value.trim();
    if (!q) { lookupResults.innerHTML = ''; return; }
    lookupTimer = setTimeout(async () => {
      try {
        const matches = await searchProducts(q);
        if (!matches.length) { lookupResults.innerHTML = '<p class="muted">No SKUs match.</p>'; return; }
        lookupResults.innerHTML = '<div class="table-scroll"><table><thead><tr>' +
          '<th>SKU</th><th>Product Name</th><th>Price</th><th>Est. Gram</th><th>Status</th>' +
          '</tr></thead><tbody>' + matches.slice(0, 30).map((p) =>
            '<tr>' +
              '<td data-label="SKU"><b>' + esc(p.sku) + '</b></td>' +
              '<td data-label="Product Name">' + esc(p.item_name) + '</td>' +
              '<td data-label="Price">' + money(p.system_selling_price) + '</td>' +
              '<td data-label="Est. Gram">' + weight(p.gross_weight_g) + '</td>' +
              '<td data-label="Status"><span class="badge ' + (p.product_status === 'Active' ? 'ok' : 'low') + '">' + esc(p.product_status) + '</span></td>' +
            '</tr>'
          ).join('') + '</tbody></table></div>';
      } catch (err) {
        lookupResults.innerHTML = '<div class="msg error">' + esc(err.message || err) + '</div>';
      }
    }, 250);
  });
}
</script>
</body>
</html>
